kind: ClusterConfiguration
apiVersion: kubeadm.k8s.io/v1beta4
kubernetesVersion: v1.37.0
controlPlaneEndpoint: "dna.ocf.berkeley.edu:6443"
networking:
  podSubnet: 10.244.0.0/16,2607:f140:8801:1::/112
  serviceSubnet: 10.96.0.0/16,2607:f140:8801:2::/112
apiServer:
  certSANs:
  - dna.ocf.io
  - dna.ocf.berkeley.edu
  extraArgs:
  - name: oidc-issuer-url
    value: "https://idm.ocf.berkeley.edu/realms/ocf"
  - name: oidc-client-id
    value: kubernetes-prod
  - name: oidc-username-claim
    value: preferred_username
  - name: oidc-username-prefix
    value: "oidc:"
  - name: oidc-groups-claim
    value: groups
  - name: oidc-groups-prefix
    value: "oidc:"
  - name: oidc-ca-file
    value: /etc/ssl/certs/ca-certificates.crt
clusterName: ocf-dna
controllerManager:
  extraArgs:
  - name: node-cidr-mask-size-ipv6
    value: "120" # match ipv4 for pods/node
  - name: node-cidr-mask-size-ipv4
    value: "24"  # default
---
kind: KubeletConfiguration
apiVersion: kubelet.config.k8s.io/v1beta1
cgroupDriver: systemd
staticPodPath: "/etc/kubernetes/manifests"
clusterDNS:
- 10.96.0.10
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: "unix:///var/run/crio/crio.sock"
skipPhases:
  - addon/kube-proxy
